<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>বিসিএস লাইভ এক্সাম ও পূর্ণাঙ্গ মডেল টেস্ট | Live MCQ</title>
  <meta name="description" content="বিসিএস প্রিলিমিনারি পরীক্ষার সেশন ভিত্তিক, বিষয়ভিত্তিক কাস্টম ও ২০০ নম্বরের পূর্ণাঙ্গ মডেল টেস্ট ইঞ্জিন।">

  <!-- Bulletproof Theme Restore -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme') || localStorage.getItem('ebk_portal_theme') || localStorage.getItem('bcs_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.92);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #0f766e;
      --primary-hover: #0d9488;
      --primary-light: rgba(15, 118, 110, 0.1);
      --accent-gold: #f59e0b;
      --accent-gold-light: rgba(245, 158, 11, 0.12);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.12);
      --warning: #f97316;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 28px rgba(0,0,0,0.12);
      --transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      --font-serif: 'Noto Serif Bengali', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="dark"] {
      --bg-base: #090d16;
      --bg-surface: #111827;
      --bg-card: rgba(21, 31, 50, 0.92);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --primary: #14b8a6;
      --primary-hover: #2dd4bf;
      --primary-light: rgba(20, 184, 166, 0.15);
      --accent-gold: #fbbf24;
      --accent-gold-light: rgba(251, 191, 36, 0.15);
      --success: #34d399;
      --success-light: rgba(52, 211, 153, 0.15);
      --danger: #f87171;
      --danger-light: rgba(248, 113, 113, 0.15);
      --warning: #fb923c;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 28px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-serif);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    /* Top Sticky Navigation Bar */
    .app-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-icon {
      font-size: 1.4rem;
    }

    .brand-title {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .brand-tag {
      font-size: 0.75rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      display: none;
    }
    @media(min-width: 640px) {
      .brand-tag { display: inline-block; }
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-portal-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }
    .btn-portal-back:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .theme-toggle-btn:hover {
      background: var(--border-color);
    }

    /* Main Container */
    .main-container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px 16px 60px 16px;
      width: 100%;
      flex: 1;
    }

    /* ===================================================
       1. SETUP SCREEN STYLES
       =================================================== */
    .exam-setup-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setup-header {
      text-align: center;
      padding: 18px 12px 10px 12px;
    }

    .setup-badge {
      display: inline-block;
      background: var(--accent-gold-light);
      color: var(--accent-gold);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .setup-title {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #0f766e, #881337);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    [data-theme="dark"] .setup-title {
      background: linear-gradient(135deg, #2dd4bf, #fb7185);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .setup-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 640px;
      margin: 0 auto;
    }

    /* Mode Selector Tabs */
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: var(--bg-surface);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    @media(min-width: 768px) {
      .mode-tabs {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .mode-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .mode-tab-btn:hover {
      color: var(--text-main);
      background: var(--bg-base);
    }
    .mode-tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
    }

    /* Card Panels */
    .setup-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      box-shadow: var(--shadow-sm);
    }

    .section-label {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    /* Quick Chips Row */
    .quick-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip-btn {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .chip-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .chip-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.25);
    }

    /* Custom Form Elements */
    .custom-select, .custom-input {
      width: 100%;
      background: var(--bg-base);
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      transition: var(--transition);
    }
    .custom-select:focus, .custom-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Announcement Box */
    .announcement-box {
      margin-top: 18px;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.08), rgba(245, 158, 11, 0.08));
      border: 1.5px solid rgba(15, 118, 110, 0.3);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }
    .announcement-box.info {
      background: rgba(15, 118, 110, 0.06);
      border-color: rgba(15, 118, 110, 0.25);
    }
    .announcement-box.gold {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(136, 19, 55, 0.08));
      border-color: rgba(245, 158, 11, 0.4);
    }
    .announcement-icon {
      font-size: 1.4rem;
      line-height: 1;
      padding-top: 2px;
    }
    .announcement-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .announcement-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* Subject Selection Grid */
    .subject-selection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toggle-all-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
    }
    .btn-text-action {
      background: none;
      border: none;
      color: var(--primary);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }
    .sep { color: var(--border-color); }

    .subject-checkboxes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .subject-check-card {
      display: flex;
      align-items: center;
      background: var(--bg-base);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      position: relative;
    }
    .subject-check-card input {
      margin-right: 10px;
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .subject-check-card.checked {
      background: var(--primary-light);
      border-color: var(--primary);
    }
    .check-content {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .sub-icon { font-size: 1.25rem; }
    .sub-meta { display: flex; flex-direction: column; }
    .sub-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }
    .sub-count-badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-weight: 600;
    }

    /* Mock 200 Syllabus Grid */
    .syllabus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .syl-card {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
    }
    .syl-name { font-weight: 600; }
    .syl-mark {
      font-weight: 700;
      color: var(--primary);
      font-family: var(--font-sans);
    }
    .mock-summary-bar {
      margin-top: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: space-around;
      font-size: 0.92rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Settings Card & Start Button */
    .settings-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-color);
    }

    .time-settings-inner {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media(min-width: 768px) {
      .time-settings-inner {
        grid-template-columns: 1.3fr 1fr;
        align-items: center;
      }
    }

    .settings-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .rule-indicator-box {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .rule-icon { font-size: 1.1rem; }
    .rule-text { color: var(--text-muted); }
    .rule-text strong { color: var(--text-main); }

    .custom-checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .custom-checkbox-label input {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
    }

    .custom-time-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      margin-left: 25px;
      font-size: 0.88rem;
    }
    .custom-time-input-wrap.disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .custom-time-input-wrap .custom-input {
      width: 85px;
      padding: 5px 8px;
      font-size: 0.9rem;
    }

    /* Exam Summary Card */
    .exam-summary-card {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.05), rgba(136, 19, 55, 0.05));
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
      color: var(--text-muted);
    }
    .summary-line strong {
      color: var(--text-main);
      font-size: 1.05rem;
    }

    .btn-start-exam {
      margin-top: 8px;
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: #ffffff;
      border: none;
      padding: 13px 20px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(15, 118, 110, 0.35);
      transition: var(--transition);
      text-align: center;
      width: 100%;
    }
    .btn-start-exam:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.45);
    }
    .btn-start-exam:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      background: var(--border-color);
      color: var(--text-muted);
    }

    /* ===================================================
       2. ACTIVE EXAM HALL STYLES
       =================================================== */
    .exam-hall-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Sticky Exam Topbar */
    .exam-topbar {
      position: sticky;
      top: 57px;
      z-index: 95;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    .exam-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .exam-btn-back {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .exam-btn-back:hover {
      background: var(--danger-light);
      color: var(--danger);
      border-color: var(--danger);
    }

    .exam-title-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Source Toggle Button */
    .exam-topbar-controls {
      display: flex;
      align-items: center;
    }
    .exam-btn-source-toggle {
      background: var(--bg-base);
      border: 1.5px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .exam-btn-source-toggle:hover {
      background: var(--border-color);
      color: var(--text-main);
    }
    .exam-btn-source-toggle.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* Blind Exam Mode: Hide Sources */
    .hide-exam-sources .q-bcs-badge,
    .hide-exam-sources .review-card-bcs,
    .hide-exam-sources .q-exam-source-tag,
    .hide-exam-sources .source-tag {
      display: none !important;
    }

    /* Timer Badge */
    .exam-timer-badge {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 1.12rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .exam-timer-badge.warning {
      border-color: var(--warning);
      color: var(--warning);
      background: rgba(249, 115, 22, 0.1);
    }
    .exam-timer-badge.danger-pulse {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-light);
      animation: timerPulse 1s infinite alternate;
    }
    @keyframes timerPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
      100% { transform: scale(1.05); box-shadow: 0 0 14px rgba(239, 68, 68, 0.4); }
    }

    .exam-topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .exam-progress-badge {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      display: none;
    }
    @media(min-width: 768px) {
      .exam-progress-badge { display: block; }
    }
    .exam-progress-badge strong {
      color: var(--text-main);
      font-family: var(--font-sans);
    }

    .btn-submit-exam {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 7px 15px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-submit-exam:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    /* Responsive Exam Topbar for Mobile Phones (prevents right-edge cutoff on Samsung A23 and 360-400px devices) */
    @media (max-width: 640px) {
      .exam-topbar {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        gap: 8px 10px;
        padding: 8px 12px;
      }
      .exam-topbar-left {
        grid-column: 1 / 2;
        grid-row: 1 / 2;
        gap: 6px;
      }
      .exam-title-badge {
        max-width: 135px;
        font-size: 0.78rem;
        padding: 3px 8px;
      }
      .exam-topbar-controls {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        justify-content: flex-end;
      }
      .exam-btn-source-toggle {
        padding: 4px 8px;
        font-size: 0.75rem;
      }
      .exam-topbar-center {
        grid-column: 1 / 2;
        grid-row: 2 / 3;
        display: flex;
        align-items: center;
      }
      .exam-timer-badge {
        padding: 4px 10px;
        font-size: 0.95rem;
      }
      .exam-topbar-right {
        grid-column: 2 / 3;
        grid-row: 2 / 3;
        justify-content: flex-end;
        gap: 6px;
      }
      .btn-submit-exam {
        padding: 6px 12px;
        font-size: 0.82rem;
      }
    }
    @media (max-width: 380px) {
      .exam-title-badge {
        max-width: 100px;
        font-size: 0.74rem;
      }
      .exam-btn-back {
        padding: 4px 6px;
        font-size: 0.75rem;
      }
      .exam-timer-badge {
        font-size: 0.88rem;
        padding: 3px 8px;
      }
      .btn-submit-exam {
        padding: 5px 10px;
        font-size: 0.78rem;
    }

    /* ==========================================
       SUBJECT SWITCHER BAR (MANDATORY FEATURE)
       ========================================== */
    .subject-switcher-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .subject-switcher-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 2px;
    }
    .subject-switcher-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .subject-switcher-scroll::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 999px;
    }

    .subject-tab-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-base);
      border: 1.5px solid var(--border-color);
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .subject-tab-chip:hover {
      color: var(--text-main);
      border-color: var(--primary);
    }
    .subject-tab-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
    }
    .chip-count {
      background: rgba(0,0,0,0.08);
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-family: var(--font-sans);
    }
    .subject-tab-chip.active .chip-count {
      background: rgba(255,255,255,0.25);
      color: #ffffff;
    }

    /* Exam Layout (Questions Stream + Palette) */
    .exam-main-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
    }
    @media(min-width: 900px) {
      .exam-main-layout {
        grid-template-columns: 1fr 280px;
      }
    }

    .exam-questions-stream {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Question Card */
    .exam-q-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      position: relative;
    }
    .exam-q-card.answered {
      border-color: rgba(16, 185, 129, 0.4);
    }
    .exam-q-card.subject-filtered-out {
      display: none !important;
    }
    .exam-q-card.highlight-pulse {
      animation: highlightPulse 1.2s ease;
    }
    @keyframes highlightPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(15, 118, 110, 0); }
      50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(15, 118, 110, 0.35); border-color: var(--primary); }
      100% { transform: scale(1); }
    }

    .exam-q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .exam-q-num-badge {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .exam-q-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .q-sub-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .q-bcs-badge {
      background: var(--accent-gold-light);
      color: var(--accent-gold);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .exam-q-text {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .exam-options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }
    @media(min-width: 600px) {
      .exam-options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .exam-opt-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-base);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }
    .exam-opt-btn:hover {
      border-color: var(--primary);
      background: var(--bg-surface);
    }
    .exam-opt-btn.selected {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(15, 118, 110, 0.3);
    }

    .opt-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .exam-opt-btn.selected .opt-key {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
    }

    .opt-label-text {
      flex: 1;
      font-weight: 600;
    }

    .exam-q-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      min-height: 24px;
    }
    .btn-clear-opt {
      background: none;
      border: none;
      color: var(--danger);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }
    .btn-clear-opt.visible {
      display: inline-block;
    }

    /* Palette Sidebar */
    .exam-palette-sidebar {
      position: sticky;
      top: 125px;
    }
    .palette-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      max-height: calc(100vh - 150px);
      display: flex;
      flex-direction: column;
    }
    .palette-header {
      margin-bottom: 12px;
    }
    .palette-title {
      font-size: 0.94rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .palette-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
    }
    .dot.done { background: var(--primary); }
    .dot.unans { background: var(--border-color); }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .palette-btn {
      aspect-ratio: 1;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .palette-btn:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }
    .palette-btn.answered {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Timeout Modal Overlay */
    .timeout-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(5px);
    }
    .timeout-modal-box {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 30px 24px;
      max-width: 420px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .timeout-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      animation: bellShake 0.6s infinite alternate;
    }
    @keyframes bellShake {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--primary);
      border-radius: 999px;
      margin: 16px auto 0 auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal Overlay General */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }
    .modal-box {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .modal-close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    .submit-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }
    .sub-stat-item {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
    }
    .sub-stat-item .lbl {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .sub-stat-item strong {
      font-size: 1.15rem;
    }
    .sub-stat-item.answered strong { color: var(--success); }
    .sub-stat-item.skipped strong { color: var(--warning); }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-secondary:hover { background: var(--border-color); }

    /* ===================================================
       3. RESULTS & REVIEW STYLES
       =================================================== */
    .results-wrapper {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .result-hero-card {
      background: var(--bg-surface);
      border: 2px solid var(--primary);
      border-radius: var(--radius-lg);
      padding: 30px 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }
    .result-hero-card.pass {
      border-color: var(--success);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(15, 118, 110, 0.06));
    }
    .result-hero-card.warning {
      border-color: var(--warning);
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.08), rgba(245, 158, 11, 0.06));
    }
    .result-hero-card.danger {
      border-color: var(--danger);
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(136, 19, 55, 0.06));
    }

    .result-badge-top {
      display: inline-block;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .score-display {
      font-family: var(--font-sans);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .score-main {
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }
    .score-divider {
      font-size: 2rem;
      color: var(--text-muted);
    }
    .score-total {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .result-status-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .result-status-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto;
    }
    .formula-caption {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media(min-width: 640px) {
      .metrics-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    @media(min-width: 900px) {
      .metrics-grid {
        grid-template-columns: repeat(7, 1fr);
      }
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .metric-icon { font-size: 1.3rem; margin-bottom: 4px; }
    .metric-val {
      font-family: var(--font-sans);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }
    .metric-lbl {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
    }
    .metric-card.correct .metric-val { color: var(--success); }
    .metric-card.wrong .metric-val { color: var(--danger); }
    .metric-card.skipped .metric-val { color: var(--warning); }

    /* Review Section */
    .review-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: var(--shadow-sm);
    }

    .review-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }
    @media(min-width: 768px) {
      .review-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }
    .review-header h2 {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .review-filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-pill {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-pill:hover {
      color: var(--text-main);
    }
    .filter-pill.active {
      background: var(--text-main);
      color: var(--bg-base);
      border-color: var(--text-main);
    }
    .filter-pill.wrong.active {
      background: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }
    .filter-pill.correct.active {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }
    .filter-pill.skipped.active {
      background: var(--warning);
      color: #ffffff;
      border-color: var(--warning);
    }

    .review-cards-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Review Card */
    .review-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }
    .review-card.correct { border-left: 5px solid var(--success); }
    .review-card.wrong { border-left: 5px solid var(--danger); }
    .review-card.skipped { border-left: 5px solid var(--warning); }

    .review-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .q-meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .q-idx-badge {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .q-status-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .q-status-badge.correct { background: var(--success-light); color: var(--success); }
    .q-status-badge.wrong { background: var(--danger-light); color: var(--danger); }
    .q-status-badge.skipped { background: rgba(249, 115, 22, 0.12); color: var(--warning); }

    .review-q-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .review-options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    @media(min-width: 600px) {
      .review-options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .review-opt-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 0.92rem;
      position: relative;
    }
    .review-opt-box.is-correct {
      background: var(--success-light);
      border-color: var(--success);
      font-weight: 700;
    }
    .review-opt-box.is-wrong-chosen {
      background: var(--danger-light);
      border-color: var(--danger);
      font-weight: 700;
    }
    .review-opt-box.is-correct-chosen {
      background: var(--success-light);
      border-color: var(--success);
      font-weight: 700;
    }
    .opt-tag {
      margin-left: auto;
      font-size: 0.75rem;
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 800;
      white-space: nowrap;
    }
    .opt-tag.correct { background: var(--success); color: #ffffff; }
    .opt-tag.wrong { background: var(--danger); color: #ffffff; }

    /* Explanation Drawer */
    .review-exp-container {
      margin-top: 10px;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
    }
    .btn-toggle-exp {
      background: none;
      border: none;
      color: var(--primary);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-toggle-exp:hover { text-decoration: underline; }
    .exp-arrow { font-size: 0.72rem; }

    .review-exp-drawer {
      display: none;
      margin-top: 10px;
    }
    .review-exp-drawer.open {
      display: block;
    }
    .exp-content-box {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .exp-answer-row {
      margin-bottom: 6px;
      font-size: 0.94rem;
    }
    .ans-label { color: var(--success); font-weight: 800; }
    .exp-body-text { color: var(--text-muted); }

    /* Results Action Footer */
    .results-footer-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="app-topbar">
    <a href="index.html" class="brand-wrap">
      <span class="brand-icon">🏛️</span>
      <span class="brand-title">বিসিএস স্মার্ট লাইব্রেরি</span>
      <span class="brand-tag">লাইভ এক্সাম ইঞ্জিন</span>
    </a>
    <div class="topbar-actions">
      <a href="index.html" class="btn-portal-back">
        <span>← লাইব্রেরিতে ফিরুন</span>
      </a>
      <button class="theme-toggle-btn" id="examThemeBtn" onclick="toggleExamTheme()" title="থিম পরিবর্তন">
        <span id="examThemeIcon">🌙</span>
        <span id="examThemeText" style="display:none;">ডার্ক</span>
      </button>
    </div>
  </header>

  <!-- Main App Shell -->
  <main class="main-container">
    <div id="examApp">
      <!-- Loading State -->
      <div style="text-align:center; padding: 80px 20px;">
        <div class="loading-spinner"></div>
        <p style="margin-top:16px; font-weight:700; color:var(--text-muted);">বিসিএস প্রশ্নব্যাংক ও এক্সাম ইঞ্জিন লোড হচ্ছে...</p>
      </div>
    </div>
  </main>

  <!-- Theme Script -->
  <script>
    function toggleExamTheme() {
      var cur = document.documentElement.getAttribute('data-theme') || 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      if (next === 'dark') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
      try {
        localStorage.setItem('theme', next);
        localStorage.setItem('ebk_portal_theme', next);
      } catch(e) {}
      updateThemeIcon(next);
    }
    function updateThemeIcon(theme) {
      var icon = document.getElementById('examThemeIcon');
      if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    document.addEventListener('DOMContentLoaded', function() {
      var cur = document.documentElement.getAttribute('data-theme') || 'light';
      updateThemeIcon(cur);
    });
  </script>

  <!-- Exam Engine Script -->
  <script src="exam-engine.js"></script>
</body>
</html>
