<!-- Master Index Subject Card Snippet Template -->
<article class="master-subject-card" data-subject-id="{{SUBJECT_ID}}">
  <div class="master-card-top">
    <div class="master-card-badge">{{SUBJECT_SERIAL}}</div>
    <div>
      <h2 class="master-card-title">{{SUBJECT_NAME}}</h2>
      <div class="master-card-meta">
        <span>📖 {{CHAPTER_COUNT}}</span>
        <span>·</span>
        <span>🎯 {{QUESTION_COUNT}}</span>
        <span>·</span>
        <span>📄 {{PAGE_RANGE}}</span>
      </div>
    </div>
  </div>

  <div class="master-card-progress">
    <div class="progress-track">
      <div class="progress-fill" id="{{PROGRESS_FILL_ID}}" style="width: 0%"></div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:4px; font-size:0.75rem; color:var(--text-subtle);">
      <span>পড়ার অগ্রগতি:</span>
      <span id="{{PROGRESS_TEXT_ID}}" style="font-weight:700; color:var(--accent-text);">০%</span>
    </div>
  </div>

  <div class="master-card-actions">
    <a href="{{FIRST_CHAPTER_HREF}}" class="btn btn-primary" title="প্রথম অধ্যায় থেকে পড়া শুরু করুন">
      পড়া শুরু করুন
    </a>
    <a href="{{SUBJECT_INDEX_HREF}}" class="btn btn-secondary" title="সূচিপত্র ও পরিচ্ছেদ তালিকা দেখুন">
      সূচিপত্র
    </a>
  </div>
</article>
