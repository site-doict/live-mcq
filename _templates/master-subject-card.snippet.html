<!-- Master Index Subject Card Snippet Template -->
<article class="master-subject-card" data-subject-id="{{SUBJECT_ID}}">
  <div class="master-card-top">
    <span class="master-card-badge">{{SUBJECT_SERIAL}}</span>
    <div class="flex-grow">
      <h2 class="master-card-title">{{SUBJECT_NAME}}</h2>
    </div>
  </div>

  <div class="master-card-meta">
    <span>{{CHAPTER_COUNT}} · {{QUESTION_COUNT}} · {{PAGE_RANGE}}</span>
  </div>

  <div class="master-card-progress">
    <div class="prog-meta-row">
      <span class="prog-label">পড়ার অগ্রগতি:</span>
      <span class="prog-pct" id="{{PROGRESS_TEXT_ID}}">০%</span>
    </div>
    <div class="sub-prog-bar-bg">
      <div class="sub-prog-fill" id="{{PROGRESS_FILL_ID}}" style="--p:0%;"></div>
    </div>
  </div>

  <div class="master-card-actions">
    <a href="{{FIRST_CHAPTER_HREF}}" class="btn btn-primary" title="প্রথম অধ্যায় থেকে পড়া শুরু করুন">
      <span>পড়া শুরু করুন</span>
      <span>→</span>
    </a>
    <a href="{{SUBJECT_INDEX_HREF}}" class="btn btn-secondary" title="সূচিপত্র ও পরিচ্ছেদ তালিকা দেখুন">
      <span>সূচিপত্র</span>
    </a>
  </div>
</article>
