<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<!-- DESIGN PLAN:
(১) বিষয়ের ধরন: বাংলাদেশ বিষয়াবলি - বাংলাদেশের ভাস্কর্য, স্মারক স্থাপত্য ও ভাস্করগণ (পৃষ্ঠা ৫৬২ হতে ৫৬৪)।
(২) সবচেয়ে কঠিন/গুলিয়ে ফেলার জায়গা:
    - একই বা কাছাকাছি নামের ভাস্কর্য ও বিভিন্ন ক্যাম্পাসে এদের অবস্থান (যেমন: 'সাবাস বাংলাদেশ' = নিতুন কুণ্ডু, রাজশাহী বিশ্ববিদ্যালয়; 'অপরাজেয় বাংলা' = সৈয়দ আব্দুল্লাহ খালেদ, ঢাবি কলা ভবন; 'সংশপ্তক' = হামিদুজ্জামান খান, জাবি; 'জাগ্রত চৌরঙ্গী' = আব্দুর রাজ্জাক, জয়দেবপুর চৌরাস্তা; 'চেতনা ৭১' = কুষ্টিয়া পুলিশ লাইন বনাম শাবিপ্রবি)।
    - জাতীয় স্মৃতিসৌধের ফলক ও স্থাপত্যতথ্য (স্থপতি সৈয়দ মাইনুল হোসেন; ৭টি ফলক; উচ্চতা ১৫০ ফুট বা ৪৬ মিটার; ভিত্তিপ্রস্তর ১৯৭২ বঙ্গবন্ধু, উদ্বোধন ১৯৮২ এরশাদ)।
    - ভাস্কর নভেরা আহমেদ সংক্রান্ত তথ্য (আধুনিক ভাস্কর্যের পথিকৃৎ; ১৯৯৭ একুশে পদক ও ২০২৫ মরণোত্তর স্বাধীনতা পদক; কেন্দ্রীয় শহীদ মিনারের নকশায় হামিদুর রহমানকে সহযোগিতা; শিল্পকর্ম: 'হিউমানিটি', 'নিঃসঙ্গ', 'আত্মা', 'স্নান', 'কক্সবাজার')।
    - সিউল অলিম্পিকে (১৯৮৮) স্থান পাওয়া ভাস্কর্য 'স্টেপস' এবং শিল্পী হামিদুজ্জামান খানের অনন্য কীর্তিসমূহ।
    - দেশের বাইরে প্রথম শহীদ মিনার (১৯৯৭, ওল্ডহ্যাম, যুক্তরাজ্য) বনাম বাংলাদেশ সরকারের অর্থায়নে প্রথম (২০০৫, টোকিও, জাপান)।
(৩) বাছাই করা মডিউল:
    - হুক: ভাস্কর্য ও স্মারক স্থাপত্যের শীর্ষ ৭টি মেগা ইনসাইট।
    - ভিজ্যুয়াল মডিউল: মুক্তিযুদ্ধের স্মারক ভাস্কর্য মাস্টার তালিকা (স্থপতি ও অবস্থান), জাতীয় স্মৃতিসৌধের ৭টি ফলকের ঐতিহাসিক সোপান ছক, খ্যাতনামা ভাস্করদের প্রোফাইল কার্ড।
    - পরীক্ষার ফাঁদ বাক্স (Trap Box): স্থপতি বনাম ভাস্কর, সাবাস বাংলাদেশ বনাম অপরাজেয় বাংলা, সিউল অলিম্পিকের ভাস্কর্য।
    - ইন্টারঅ্যাকটিভ কুইজ: ১৪টি বিসিএস প্রিলিমিনারি প্রশ্নের লাইভ স্কোরিং ও ড্রয়ার ব্যাখ্যা।
    - অসঙ্গতি ও যাচাই তালিকা: বইয়ের পৃষ্ঠা ৫৬২-৫৬৪ এর অপশন বিন্যাস ও কলাম অসঙ্গতি (প্রশ্ন ৮, ১০, ১১, ১২, ১৪)।
(৪) রঙের মেজাজ: ভাস্কর্য ও পোড়ামাটি-পাথরের মার্বেল-ব্রোঞ্জ প্যালেট (Sculpture Bronze: #7C2D12, Granite Charcoal: #1E293B, Monument Gold: #D97706, Marble Sand: #FDFBF7, Slate Border: #E2E8F0).
(৫) হিরো ও মাসকট: আধুনিক ভাস্কর্য ও শিল্পকলা গবেষক মাসকট (🗿 🏛️ 🎨 🕊️ 🔨).
-->

<title>বাংলাদেশের ভাস্কর্য ও স্মারক স্থাপত্য - বিসিএস জব সল্যুশন ই-বুক</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Kalpurush&family=Noto+Sans+Bengali:wght@400;600;700;800&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #7C2D12;
  --primary-light: #9A3412;
  --secondary: #B45309;
  --accent-gold: #D97706;
  --accent-soft: #FEF3C7;
  --bg-main: #FDFBF7;
  --bg-card: #FFFFFF;
  --text-main: #1E293B;
  --text-muted: #64748B;
  --border-color: #E2E8F0;
  --correct-bg: #ECFDF5;
  --correct-color: #047857;
  --wrong-bg: #FEF2F2;
  --wrong-color: #B91C1C;
  --shadow-sm: 0 2px 6px rgba(124, 45, 18, 0.06);
  --shadow-md: 0 6px 18px rgba(124, 45, 18, 0.1);
  --base-font-size: 1rem;
  --radius: 12px;
}

[data-theme="dark"] {
  --primary: #FB923C;
  --primary-light: #FDBA74;
  --secondary: #FBBF24;
  --accent-gold: #FCD34D;
  --accent-soft: #271A14;
  --bg-main: #0F0E0D;
  --bg-card: #1C1917;
  --text-main: #F8FAFC;
  --text-muted: #CBD5E1;
  --border-color: #382E2B;
  --correct-bg: #132E20;
  --correct-color: #6EE7B7;
  --wrong-bg: #3E1616;
  --wrong-color: #FCA5A5;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans Bengali', 'Kalpurush', sans-serif;
  font-size: var(--base-font-size);
  line-height: 1.85;
  color: var(--text-main);
  background-color: var(--bg-main);
  transition: background-color 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent-gold));
  width: 0%;
  z-index: 9999;
  transition: width 0.1s ease-out;
}

.top-control-bar {
  position: sticky;
  top: 0;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border-color);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 1000;
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}

.brand-title {
  font-weight: 800;
  color: var(--primary);
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.control-buttons {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-ctrl {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn-ctrl:hover {
  background: var(--primary);
  color: #FFFFFF;
  border-color: var(--primary);
}

.container {
  max-width: 940px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

.hero-box {
  background: linear-gradient(135deg, rgba(124, 45, 18, 0.08), rgba(217, 119, 6, 0.08));
  border: 2px solid var(--primary);
  border-radius: var(--radius);
  padding: 26px 20px;
  margin-bottom: 26px;
  position: relative;
  overflow: hidden;
}

.hero-box::before {
  content: "🗿";
  font-size: 85px;
  position: absolute;
  right: 15px;
  top: 10px;
  opacity: 0.15;
  pointer-events: none;
}

.badge-tag {
  display: inline-block;
  background: var(--primary);
  color: #FFFFFF;
  padding: 4px 14px;
  font-size: 0.8125rem;
  font-weight: 700;
  border-radius: 20px;
  margin-bottom: 12px;
}

.hero-title {
  font-family: 'Noto Serif Bengali', serif;
  font-size: 1.95rem;
  color: var(--primary);
  margin-bottom: 8px;
  line-height: 1.35;
}

.hero-subtitle {
  font-size: 1.02rem;
  color: var(--text-muted);
  margin-bottom: 18px;
}

.study-steps {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 18px;
  font-size: 0.94rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.stat-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}

.stat-num {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--primary);
  display: block;
}

.stat-desc {
  font-size: 0.83rem;
  color: var(--text-muted);
}

.study-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-left: 6px solid var(--primary);
  border-radius: var(--radius);
  padding: 22px 18px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  border-bottom: 1px dashed var(--border-color);
  padding-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}

.section-title {
  font-family: 'Noto Serif Bengali', serif;
  font-size: 1.35rem;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.target-badge {
  font-size: 0.82rem;
  background: rgba(124, 45, 18, 0.08);
  color: var(--primary);
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 700;
}

.bite-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

@media(min-width: 650px) {
  .bite-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.bite-box {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px 16px;
  transition: transform 0.2s, border-color 0.2s;
}

.bite-box:hover {
  transform: translateY(-2px);
  border-color: var(--primary-light);
}

.bite-box h4 {
  color: var(--secondary);
  margin-bottom: 6px;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

.trap-box {
  background: rgba(185, 28, 28, 0.06);
  border: 2px solid var(--wrong-color);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 14px 0;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.trap-icon {
  font-size: 1.5rem;
  line-height: 1;
}

.teaching-note {
  background: var(--accent-soft);
  border-left: 4px solid var(--primary);
  padding: 12px 16px;
  border-radius: 4px 8px 8px 4px;
  margin: 14px 0;
  font-size: 0.95rem;
  color: #1E293B;
}

[data-theme="dark"] .teaching-note {
  color: #F8FAFC;
}

.table-responsive {
  overflow-x: auto;
  margin: 14px 0;
  border: 1px solid var(--border-color);
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.94rem;
}

th {
  background: var(--primary);
  color: #FFFFFF;
  padding: 10px 14px;
  font-weight: 700;
  white-space: nowrap;
}

td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: top;
}

tr:nth-child(even) td {
  background: rgba(124, 45, 18, 0.03);
}

.quiz-dashboard {
  background: var(--bg-card);
  border: 2px solid var(--primary);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.score-display {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--primary);
}

.mcq-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s;
}

.mcq-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}

.mcq-question {
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--text-main);
  flex: 1;
}

.mcq-bcs-tag {
  background: var(--accent-gold);
  color: #FFFFFF;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

@media(min-width: 580px) {
  .options-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.option-btn {
  background: var(--bg-main);
  border: 1.5px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95rem;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease-in-out;
}

.option-btn:hover:not(:disabled) {
  background: rgba(124, 45, 18, 0.06);
  border-color: var(--primary-light);
}

.option-btn.correct-choice {
  background: var(--correct-bg) !important;
  border-color: var(--correct-color) !important;
  color: var(--correct-color) !important;
  font-weight: 700;
}

.option-btn.wrong-choice {
  background: var(--wrong-bg) !important;
  border-color: var(--wrong-color) !important;
  color: var(--wrong-color) !important;
  font-weight: 700;
}

.explanation-drawer {
  display: none;
  background: var(--bg-main);
  border-left: 4px solid var(--accent-gold);
  border-radius: 0 8px 8px 0;
  padding: 12px 16px;
  margin-top: 12px;
  font-size: 0.93rem;
  line-height: 1.75;
}

.flash-card-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.flash-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.flash-question {
  font-weight: 700;
  color: var(--secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.flash-answer {
  display: none;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-color);
  color: var(--text-main);
  font-size: 0.95rem;
}

.flash-item.open .flash-answer {
  display: block;
}

.discrepancy-card {
  background: #FFF8F6;
  border: 2px solid #FFAB91;
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 30px;
}

[data-theme="dark"] .discrepancy-card {
  background: #241A18;
  border-color: #6E2F26;
}

@media print {
  .top-control-bar, #progress-bar, .btn-ctrl, .quiz-dashboard, #quiz-reset-btn {
    display: none !important;
  }
  body {
    background: #FFFFFF;
    color: #000000;
    font-size: 11pt;
  }
  .study-card, .mcq-card {
    border: 1px solid #777777;
    page-break-inside: avoid;
    box-shadow: none;
  }
  .explanation-drawer {
    display: block !important;
  }
}

/* Universal Mobile Optimization (Samsung A23 & small screens) */
@media (max-width: 600px) {
  .print-btn, button[onclick*="print"], .btn-ctrl:has(span:contains('🖨️')) {
    display: none !important;
  }
  .container {
    padding: 6px 8px 24px 8px !important;
  }
  .hero-box, .hero, .hero-banner {
    padding: 16px 12px !important;
    margin-top: 8px !important;
    margin-bottom: 14px !important;
  }
  .table-responsive, .table-container {
    -webkit-overflow-scrolling: touch;
    overflow-x: auto;
  }
  .table-responsive table th, .table-responsive table td,
  .table-container table th, .table-container table td {
    padding: 7px 6px !important;
  }
}

</style>

<script>
// পৃষ্ঠা ৫৬২ হতে ৫৬৪-এর সম্পূর্ণ ১৪টি বিসিএস প্রশ্ন ডাটাবেজ
const bcsSculptureQuestions = [
  {
    id: 1,

let userSculptureAnswers = {};

function renderSculptureQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  bcsSculptureQuestions.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'mcq-card';
    card.id = `q-${item.id}`;

    const isAnswered = userSculptureAnswers[item.id] !== undefined;
    const selectedChoice = userSculptureAnswers[item.id];

    let optButtons = '';
    item.options.forEach((optText, optIdx) => {
      let extraClass = '';
      if (isAnswered) {
        if (optIdx === item.correct) {
          extraClass = ' correct-choice';
        } else if (selectedChoice === optIdx) {
          extraClass = ' wrong-choice';
        }
      }

      optButtons += `
        <button class="option-btn${extraClass}" 
                onclick="answerSculptureQuestion(${item.id}, ${optIdx})" 
                ${isAnswered ? 'disabled' : ''}>
          <span>${String.fromCharCode(0x0995 + optIdx)}.</span> ${optText}
        </button>
      `;
    });

    card.innerHTML = `
      <div class="mcq-header">
        <div class="mcq-question">${item.q}</div>
        <span class="mcq-bcs-tag">${item.tag}</span>
      </div>
      <div class="options-grid">
        ${optButtons}
      </div>
      <div class="explanation-drawer" style="display: ${isAnswered ? 'block' : 'none'}">
        <strong>💡 সমাধান বিশ্লেষণ:</strong> ${item.exp}
      </div>
    `;

    container.appendChild(card);
  });

  updateSculptureScore();
}

function answerSculptureQuestion(qId, choiceIdx) {
  if (userSculptureAnswers[qId] !== undefined) return;
  userSculptureAnswers[qId] = choiceIdx;
  renderSculptureQuiz();
}

function updateSculptureScore() {
  let score = 0;
  for (let id in userSculptureAnswers) {
    const q = bcsSculptureQuestions.find(i => i.id == id);
    if (q && userSculptureAnswers[id] === q.correct) {
      score++;
    }
  }
  document.getElementById('live-score').textContent = `স্কোর: ${score} / ${bcsSculptureQuestions.length}`;
}

function resetQuiz() {
  userSculptureAnswers = {};
  renderSculptureQuiz();
}

function toggleFlash(card) {
  card.classList.toggle('open');
  const span = card.querySelector('.flash-question span:last-child');
  span.textContent = card.classList.contains('open') ? '➖' : '➕';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const target = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', target);
  try {
    localStorage.setItem('sculpture_ebook_theme', target);
  } catch(e) {}
}

let fontBase = 16;
function adjustFont(delta) {
  fontBase = Math.max(14, Math.min(22, fontBase + delta));
  document.documentElement.style.setProperty('--base-font-size', fontBase + 'px');
}

window.addEventListener('scroll', () => {
  const scroll = document.documentElement.scrollTop || document.body.scrollTop;
  const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const pct = (scroll / height) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
});

window.addEventListener('DOMContentLoaded', () => {
  try {
    const saved = localStorage.getItem('sculpture_ebook_theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch(e) {}
  renderSculptureQuiz();
});
