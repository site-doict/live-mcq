<!-- DESIGN PLAN:
(১) বিষয়ের ধরন: বাংলাদেশ বিষয়াবলি - অর্থনীতি, উন্নয়ন পরিকল্পনা, রাজস্ব ব্যবস্থা, শেয়ারবাজার ও উন্নয়ন কূটনীতি (পৃষ্ঠা ৪৬৫-৪৭২)।
(২) সবচেয়ে কঠিন/গুলিয়ে ফেলার জায়গা:
    - মুদ্রা পাচারের (Money Laundering) ৩টি ধাপ (প্লেসমেন্ট, লেয়ারিং, ইন্টিগ্রেশন) বনাম আয়কর ফাঁকি (যা আলাদা অপরাধ)।
    - মূল্যস্ফীতি ও সহনীয় মাত্রা (উন্নয়নশীল দেশের সহনীয় মাত্রা ৬-৮%; বৈদেশিক মুদ্রা বৃদ্ধি মূল্যস্ফীতি বাড়ার কারণ নয়)।
    - ব-দ্বীপ পরিকল্পনা ২১০০-এর ৬টি হটস্পট, ৬টি লক্ষ্যমাত্রা এবং শতবর্ষী পরিকল্পনা কাঠামো।
    - বাংলাদেশ ব্যাংকের রিজার্ভ চুরির অর্থ পাচার (শ্রীলঙ্কা ও ফিলিপাইন; আরসিবিসি ব্যাংক)।
    - জিএসপি (GSP), ই-টিআইএন (e-TIN ২০১৩, ১২ ডিজিট), ডিম্যাট (Demat) অ্যাকাউন্ট ও বিএসইসি (BSEC)।
    - একনেক (ECNEC) প্রধান প্রধানমন্ত্রী, বিকল্প সভাপতি স্থানীয় সরকার মন্ত্রী (২৩ ফেব্রুয়ারি ২০২৬ প্রজ্ঞাপন)।
(৩) বাছাই করা মডিউল:
    - হুক: অর্থনীতির শীর্ষ ৭টি মেগা ইনসাইট।
    - ভিজ্যুয়াল মডিউল: মানি লন্ডারিং ধাপ ফ্লোচার্ট, ব-দ্বীপ পরিকল্পনা ২১০০-এর ৬ হটস্পট গ্রিড, সরকারের রাজস্ব খাত তুলনা ও শেয়ারবাজার গাইড।
    - পরীক্ষার ফাঁদ বাক্স (Trap Box): আয়কর ফাঁকি বনাম মুদ্রা পাচার, মূল্যস্ফীতি বৃদ্ধির কারণ বনাম অ-কারণ, বাংলাদেশ উন্নয়ন ফোরামের পরিচয়।
    - ইন্টারঅ্যাকটিভ কুইজ: ৩৫টি পূর্ণাঙ্গ বিসিএস এমসিকিউ-এর লাইভ স্কোরিং ও ড্রয়ার সমাধান।
    - অসঙ্গতি ও যাচাই তালিকা: বইয়ের কলাম বিন্যাসজনিত উত্তর কোডের অসামঞ্জস্য ও মুদ্রণত্রুটি নিরসন।
(৪) রঙের মেজাজ: আধুনিক রাজস্ব ও অর্থনৈতিক গ্রিন-ট্রেজারি প্যালেট (Deep Treasury Emerald: #0D5C3A, Mint Gold: #B4831B, Warm Beige: #FAF7F0, Crisp White: #FFFFFF, Slate Border: #D8DEC9).
(৫) হিরো ও মাসকট: বাংলাদেশ অর্থনীতি গবেষক ও ব্যাংকার মাসকট (🏦 📈 💰 ⚖️ 🌐).
-->

.hero-title {

.hero-subtitle {

.study-steps {

}

.stats-grid {

.stat-item {

}

.stat-desc {

}

.study-card {

  margin-bottom: 24px;

}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  border-bottom: 1px dashed var(--border-color);
  padding-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}

.section-title {
  font-family: 'Noto Serif Bengali', serif;
  font-size: 1.35rem;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.target-badge {
  font-size: 0.82rem;
  background: rgba(13, 92, 58, 0.08);

  padding: 3px 10px;
  border-radius: 12px;

}

.bite-grid {

  grid-template-columns: 1fr;

}

@media(min-width: 650px) {

    grid-template-columns: repeat(2, 1fr);

}

.bite-box {

.bite-box:hover {

.bite-box h4 {

.trap-box {

}

.trap-icon {

.teaching-note {

.table-responsive {

table {

.option-btn {

.option-btn.wrong-choice {

.explanation-drawer {

.discrepancy-card {

@media print {

<script>
// পৃষ্ঠা ৪৬৫ হতে ৪৭২-এর সম্পূর্ণ ৩৫টি বিসিএস প্রশ্ন ডাটাবেজ

let userExamAnswers = {};

function renderEconomicsQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  bcsEconomicsQuestions.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'mcq-card';
    card.id = `q-${item.id}`;

    const isAnswered = userExamAnswers[item.id] !== undefined;
    const selectedChoice = userExamAnswers[item.id];

    let optButtons = '';
    item.options.forEach((optText, optIdx) => {
      let extraClass = '';
      if (isAnswered) {
        if (optIdx === item.correct) {
          extraClass = ' correct-choice';
        } else if (selectedChoice === optIdx) {
          extraClass = ' wrong-choice';
        }
      }

      optButtons += `
        <button class="option-btn${extraClass}" 
                onclick="answerQuestion(${item.id}, ${optIdx})" 
                ${isAnswered ? 'disabled' : ''}>
          <span>${String.fromCharCode(0x0995 + optIdx)}.</span> ${optText}
        </button>
      `;
    });

    card.innerHTML = `
      <div class="mcq-header">
        <div class="mcq-question">${item.q}</div>
        <span class="mcq-bcs-tag">${item.tag}</span>
      </div>
      <div class="options-grid">
        ${optButtons}
      </div>
      <div class="explanation-drawer" style="display: ${isAnswered ? 'block' : 'none'}">
        <strong>💡 সমাধান বিশ্লেষণ:</strong> ${item.exp}
      </div>
    `;

    container.appendChild(card);
  });

  updateExamScore();
}

function answerQuestion(qId, choiceIdx) {
  if (userExamAnswers[qId] !== undefined) return;
  userExamAnswers[qId] = choiceIdx;
  renderEconomicsQuiz();
}

function updateExamScore() {
  let score = 0;
  for (let id in userExamAnswers) {
    const q = bcsEconomicsQuestions.find(i => i.id == id);
    if (q && userExamAnswers[id] === q.correct) {
      score++;
    }
  }
  document.getElementById('live-score').textContent = `স্কোর: ${score} / ${bcsEconomicsQuestions.length}`;
}

function resetQuiz() {
  userExamAnswers = {};
  renderEconomicsQuiz();
}

function toggleFlash(card) {
  card.classList.toggle('open');
  const span = card.querySelector('.flash-question span:last-child');
  span.textContent = card.classList.contains('open') ? '➖' : '➕';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const target = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', target);
  try {
    localStorage.setItem('econ_ebook_theme', target);
  } catch(e) {}
}

let fontBase = 16;
function adjustFont(delta) {
  fontBase = Math.max(14, Math.min(22, fontBase + delta));
  document.documentElement.style.setProperty('--base-font-size', fontBase + 'px');
}

window.addEventListener('scroll', () => {
  const scroll = document.documentElement.scrollTop || document.body.scrollTop;
  const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const pct = (scroll / height) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
});

window.addEventListener('DOMContentLoaded', () => {
  try {
    const saved = localStorage.getItem('econ_ebook_theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch(e) {}
  renderEconomicsQuiz();
});
