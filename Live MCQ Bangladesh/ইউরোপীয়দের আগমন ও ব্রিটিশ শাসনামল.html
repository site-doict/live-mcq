<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<!-- DESIGN PLAN:
(১) বিষয়ের ধরন: বাংলাদেশ বিষয়াবলি - ইউরোপীয়দের আগমন ও ব্রিটিশ শাসনামল (পৃষ্ঠা ৪১৪ হতে ৪২১)।
(২) সবচেয়ে কঠিন/গুলিয়ে ফেলার জায়গা: 
    - বিভিন্ন ব্রিটিশ গভর্নর জেনারেল ও ভাইসরয়দের প্রশাসনিক পদক্ষেপ ও সংস্কার (যেমন: কর্নওয়ালিস = চিরস্থায়ী বন্দোবস্ত ১৭৯৩ ও আমেরিকার স্বাধীনতা যুদ্ধ; ক্লাইভ = দ্বৈত শাসন ১৭৬৫; ক্যানিং = পুলিশ ব্যবস্থা ১৮৬১ ও কাগজের মুদ্রা; বেন্টিঙ্ক = সতীদাহ বিলোপ ১৮২৯; কার্জন = বঙ্গভঙ্গ ১৯০৫; হার্ডিঞ্জ = বঙ্গভঙ্গ রদ ১৯১১)।
    - কৃষক ও প্রতিরোধ আন্দোলনসমূহের নেতা, বছর ও স্লোগান (টঙ্ক আন্দোলন = মণি সিংহ ও হাজং/গারো কৃষক; ফরায়েজী আন্দোলন = হাজী শরীয়তউল্লাহ ও দুদু মিয়া; তিতুমীর = বাঁশের কেল্লা ১৮৩১; ফকির-সন্ন্যাসী = মজনু শাহ ও ভবানী পাঠক ১৭৬০-১৮০০; চাকমা কার্পাস বিদ্রোহ = জান বখশ খাঁ ১৭৮৭)।
    - ঢাকা বিশ্ববিদ্যালয় প্রতিষ্ঠা সংক্রান্ত সাল ও ব্যক্তিবর্গ (নবাব স্যার সলিমুল্লাহ = জমি দান ও ১৯ সদস্যের প্রতিনিধি দল ১৯১২; স্যার এ এফ রহমান = প্রথম ভারতীয় মুসলিম উপাচার্য ১৯৩৪)।
(৩) বাছাই করা মডিউল:
    - হুক: ব্রিটিশ শাসনের প্রধান ১০টি টাইমলাইন টার্নিং পয়েন্ট।
    - ভিজ্যুয়াল মডিউল: গভর্নর জেনারেলদের "কে কী করেছেন" অ্যাকশন-ম্যাট্রিক্স, কৃষক বিদ্রোহ ও জনআন্দোলনের তুলনা কার্ড, ঢাকা বিশ্ববিদ্যালয়ের ইতিহাস টাইমলাইন।
    - ফাঁদ বক্স (Trap Box): ছিয়াত্তরের মন্বন্তর (১১৭৬ বঙ্গাব্দ বনাম ১৭৭০ খ্রি.), বঙ্গভঙ্গের রাজধানী ও গভর্নর বনাম রদের বছর, দ্বিজাতি তত্ত্বের সূচনাকারী বনাম রূপকার।
    - ইন্টারঅ্যাকটিভ কুইজ: ৩৩টি বিসিএস এমসিকিউ-এর পূর্ণাঙ্গ কোড-মিলিত সমাধান, লাইভ স্কোরবোর্ড ও বিস্তারিত বিশ্লেষণ ড্রয়ার।
    - অসঙ্গতি ও যাচাই তালিকা: বইয়ের পৃষ্ঠা ৪১৪-৪২১ এর মুদ্রিত ভুল উত্তর কোড ও ব্যাখ্যার সাংঘর্ষিক রূপের স্বচ্ছ ছক।
(৪) রঙের মেজাজ: কলোনিয়াল ভিন্টেজ ও ব্রিটিশ ঐতিহাসিক প্যালেট (Imperial Maroon #7A1C14, Deep Antique Bronze #B45309, Warm Parchment #FAF7F2, Dark Slate #1E1715, Subtle Border #E6DACD)।
(৫) হিরো ও মাসকট: ঐতিহাসিক আর্কাইভাল স্টাইলের ভিন্টেজ হেডার; মাসকট হিসেবে ইতিহাস গবেষক ও সংগ্রাহক প্রতীক (📜 ⚖️ 🏛️ 🚢)।
-->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইউরোপীয়দের আগমন ও ব্রিটিশ শাসনামল - বিসিএস জব সল্যুশন ই-বুক</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalpurush&family=Noto+Sans+Bengali:wght@400;600;700;800&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #7A1C14;
  --primary-light: #9E2A20;
  --secondary: #B45309;
  --accent-gold: #D97706;
  --accent-soft: #FEF3C7;
  --bg-main: #FAF7F2;
  --bg-card: #FFFFFF;
  --text-main: #231815;
  --text-muted: #614D46;
  --border-color: #E6DACD;
  --correct-bg: #E8F5E9;
  --correct-color: #1E7E34;
  --wrong-bg: #FFEBEE;
  --wrong-color: #B71C1C;
  --shadow-sm: 0 2px 8px rgba(122, 28, 20, 0.06);
  --shadow-md: 0 6px 20px rgba(122, 28, 20, 0.1);
  --base-font-size: 1rem;
  --radius: 12px;
}

[data-theme="dark"] {
  --primary: #FF7B6B;
  --primary-light: #FFA194;
  --secondary: #FBBF24;
  --accent-gold: #FCD34D;
  --accent-soft: #2B2117;
  --bg-main: #14100E;
  --bg-card: #1E1815;
  --text-main: #F7EEE7;
  --text-muted: #C4B1A3;
  --border-color: #3D2D24;
  --correct-bg: #1B3820;
  --correct-color: #81C784;
  --wrong-bg: #3E1B1B;
  --wrong-color: #E57373;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans Bengali', 'Kalpurush', sans-serif;
  font-size: var(--base-font-size);
  line-height: 1.85;
  color: var(--text-main);
  background-color: var(--bg-main);
  transition: background-color 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

/* রিডিং প্রগ্রেস বার */
#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent-gold));
  width: 0%;
  z-index: 9999;
  transition: width 0.1s ease-out;
}

/* স্টিকি কন্ট্রোল বার */
.top-control-bar {
  position: sticky;
  top: 0;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border-color);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 1000;
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}

.brand-title {
  font-weight: 800;
  color: var(--primary);
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.control-buttons {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-ctrl {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn-ctrl:hover {
  background: var(--primary);
  color: #FFFFFF;
  border-color: var(--primary);
}

.container {
  max-width: 940px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

/* হিরো বক্স */
.hero-box {
  background: linear-gradient(135deg, rgba(122, 28, 20, 0.08), rgba(180, 83, 9, 0.09));
  border: 2px solid var(--primary);
  border-radius: var(--radius);
  padding: 26px 20px;
  margin-bottom: 26px;
  position: relative;
  overflow: hidden;
}

.hero-box::before {
  content: "🚢";
  font-size: 85px;
  position: absolute;
  right: 15px;
  top: 10px;
  opacity: 0.15;
  pointer-events: none;
}

.badge-tag {
  display: inline-block;
  background: var(--primary);
  color: #FFFFFF;
  padding: 4px 14px;
  font-size: 0.8125rem;
  font-weight: 700;
  border-radius: 20px;
  margin-bottom: 12px;
}

.hero-title {
  font-family: 'Noto Serif Bengali', serif;
  font-size: 1.95rem;
  color: var(--primary);
  margin-bottom: 8px;
  line-height: 1.35;
}

.hero-subtitle {
  font-size: 1.02rem;
  color: var(--text-muted);
  margin-bottom: 18px;
}

.study-steps {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 18px;
  font-size: 0.94rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 10px;
}

.stat-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}

.stat-num {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--primary);
  display: block;
}

.stat-desc {
  font-size: 0.83rem;
  color: var(--text-muted);
}

/* সেকশন কার্ড */
.study-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-left: 6px solid var(--primary);
  border-radius: var(--radius);
  padding: 22px 18px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  border-bottom: 1px dashed var(--border-color);
  padding-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}

.section-title {
  font-family: 'Noto Serif Bengali', serif;
  font-size: 1.35rem;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.target-badge {
  font-size: 0.82rem;
  background: rgba(122, 28, 20, 0.08);
  color: var(--primary);
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 700;
}

/* বাইট সাইজ গ্রিড */
.bite-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

@media(min-width: 650px) {
  .bite-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.bite-box {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px 16px;
  transition: transform 0.2s, border-color 0.2s;
}

.bite-box:hover {
  transform: translateY(-2px);
  border-color: var(--primary-light);
}

.bite-box h4 {
  color: var(--secondary);
  margin-bottom: 6px;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* সতর্কতা ও ফাঁদ বক্স */
.trap-box {
  background: rgba(183, 28, 28, 0.06);
  border: 2px solid var(--wrong-color);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 14px 0;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.trap-icon {
  font-size: 1.5rem;
  line-height: 1;
}

.teaching-note {
  background: var(--accent-soft);
  border-left: 4px solid var(--accent-gold);
  padding: 12px 16px;
  border-radius: 4px 8px 8px 4px;
  margin: 14px 0;
  font-size: 0.95rem;
}

/* টেবিল */
.table-responsive {
  overflow-x: auto;
  margin: 14px 0;
  border: 1px solid var(--border-color);
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.94rem;
}

th {
  background: var(--primary);
  color: #FFFFFF;
  padding: 10px 14px;
  font-weight: 700;
  white-space: nowrap;
}

td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: top;
}

tr:nth-child(even) td {
  background: rgba(122, 28, 20, 0.03);
}

/* কুইজ ড্যাশবোর্ড */
.quiz-dashboard {
  background: var(--bg-card);
  border: 2px solid var(--primary);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.score-display {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--primary);
}

/* কুইজ কার্ড */
.mcq-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s;
}

.mcq-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}

.mcq-question {
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--text-main);
  flex: 1;
}

.mcq-bcs-tag {
  background: var(--accent-gold);
  color: #FFFFFF;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

@media(min-width: 580px) {
  .options-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.option-btn {
  background: var(--bg-main);
  border: 1.5px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95rem;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease-in-out;
}

.option-btn:hover:not(:disabled) {
  background: rgba(122, 28, 20, 0.06);
  border-color: var(--primary-light);
}

.option-btn.correct-choice {
  background: var(--correct-bg) !important;
  border-color: var(--correct-color) !important;
  color: var(--correct-color) !important;
  font-weight: 700;
}

.option-btn.wrong-choice {
  background: var(--wrong-bg) !important;
  border-color: var(--wrong-color) !important;
  color: var(--wrong-color) !important;
  font-weight: 700;
}

.explanation-drawer {
  display: none;
  background: var(--bg-main);
  border-left: 4px solid var(--accent-gold);
  border-radius: 0 8px 8px 0;
  padding: 12px 16px;
  margin-top: 12px;
  font-size: 0.93rem;
  line-height: 1.75;
}

/* ফ্ল্যাশকার্ড */
.flash-card-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.flash-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.flash-question {
  font-weight: 700;
  color: var(--secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.flash-answer {
  display: none;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-color);
  color: var(--text-main);
  font-size: 0.95rem;
}

.flash-item.open .flash-answer {
  display: block;
}

/* অসঙ্গতি কার্ড */
.discrepancy-card {
  background: #FFF8F6;
  border: 2px solid #FFAB91;
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 30px;
}

[data-theme="dark"] .discrepancy-card {
  background: #251B17;
  border-color: #6D3425;
}

/* প্রিন্ট স্টাইল */
@media print {
  .top-control-bar, #progress-bar, .btn-ctrl, .quiz-dashboard, #quiz-reset-btn {
    display: none !important;
  }
  body {
    background: #FFFFFF;
    color: #000000;
    font-size: 11pt;
  }
  .study-card, .mcq-card {
    border: 1px solid #777777;
    page-break-inside: avoid;
    box-shadow: none;
  }
  .explanation-drawer {
    display: block !important;
  }
}

/* Universal Mobile Optimization (Samsung A23 & small screens) */
@media (max-width: 600px) {
  .print-btn, button[onclick*="print"], .btn-ctrl:has(span:contains('🖨️')) {
    display: none !important;
  }
  .container {
    padding: 6px 8px 24px 8px !important;
  }
  .hero-box, .hero, .hero-banner {
    padding: 16px 12px !important;
    margin-top: 8px !important;
    margin-bottom: 14px !important;
  }
  .table-responsive, .table-container {
    -webkit-overflow-scrolling: touch;
    overflow-x: auto;
  }
  .table-responsive table th, .table-responsive table td,
  .table-container table th, .table-container table td {
    padding: 7px 6px !important;
  }
}

</style>
</head>

<!-- কন্ট্রোল বার -->
<header class="top-control-bar">
  <div class="brand-title">
    <span>📜</span> ইউরোপীয়দের আগমন ও ব্রিটিশ শাসনামল

  <div class="control-buttons">
    <button class="btn-ctrl" onclick="toggleTheme()" id="theme-btn">🌓 থিম</button>

    <button class="btn-ctrl" onclick="adjustFont(1)">A+</button>
    <button class="btn-ctrl" onclick="window.print()">🖨️ প্রিন্ট</button>
    <a href="#toc" class="btn-ctrl" style="text-decoration:none;">📖 সূচি</a>
  </div>
</header>

<main class="container">

<script>
// পৃষ্ঠা ৪১৪ হতে ৪২১-এর সম্পূর্ণ ৩৩টি বিসিএস প্রশ্ন ডাটাবেজ
const bcsBritishQuestions = [

    correct: 0, // ১৯৫০ সালে

  }
];

let userExamAnswers = {};

function renderExamQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  bcsBritishQuestions.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'mcq-card';
    card.id = `q-${item.id}`;

    const isAnswered = userExamAnswers[item.id] !== undefined;
    const selectedChoice = userExamAnswers[item.id];

    let optButtons = '';
    item.options.forEach((optText, optIdx) => {
      let extraClass = '';
      if (isAnswered) {
        if (optIdx === item.correct) {
          extraClass = ' correct-choice';
        } else if (selectedChoice === optIdx) {
          extraClass = ' wrong-choice';
        }
      }

      optButtons += `
        <button class="option-btn${extraClass}" 
                onclick="answerQuestion(${item.id}, ${optIdx})" 
                ${isAnswered ? 'disabled' : ''}>
          <span>${String.fromCharCode(0x0995 + optIdx)}.</span> ${optText}
        </button>
      `;
    });

    card.innerHTML = `
      <div class="mcq-header">
        <div class="mcq-question">${item.q}</div>
        <span class="mcq-bcs-tag">${item.tag}</span>
      </div>
      <div class="options-grid">
        ${optButtons}
      </div>
      <div class="explanation-drawer" style="display: ${isAnswered ? 'block' : 'none'}">
        <strong>💡 সমাধান বিশ্লেষণ:</strong> ${item.exp}
      </div>
    `;

    container.appendChild(card);
  });

  updateExamScore();
}

function answerQuestion(qId, choiceIdx) {
  if (userExamAnswers[qId] !== undefined) return;
  userExamAnswers[qId] = choiceIdx;
  renderExamQuiz();
}

function updateExamScore() {
  let score = 0;
  for (let id in userExamAnswers) {
    const q = bcsBritishQuestions.find(i => i.id == id);
    if (q && userExamAnswers[id] === q.correct) {
      score++;
    }
  }
  document.getElementById('live-score').textContent = `স্কোর: ${score} / ${bcsBritishQuestions.length}`;
}

function resetQuiz() {
  userExamAnswers = {};
  renderExamQuiz();
}

function toggleFlash(card) {
  card.classList.toggle('open');
  const span = card.querySelector('.flash-question span:last-child');
  span.textContent = card.classList.contains('open') ? '➖' : '➕';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const target = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', target);
  try {
    localStorage.setItem('british_ebook_theme', target);
  } catch(e) {}
}

let fontBase = 16;
function adjustFont(delta) {
  fontBase = Math.max(14, Math.min(22, fontBase + delta));
  document.documentElement.style.setProperty('--base-font-size', fontBase + 'px');
}

// রিডিং প্রগ্রেস বার
window.addEventListener('scroll', () => {
  const scroll = document.documentElement.scrollTop || document.body.scrollTop;
  const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const pct = (scroll / height) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
});

// ইনিশিয়ালাইজেশন
window.addEventListener('DOMContentLoaded', () => {
  try {
    const saved = localStorage.getItem('british_ebook_theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch(e) {}
  renderExamQuiz();
});
