<!-- DESIGN PLAN:
(১) বিষয়ের ধরন: বাংলাদেশ বিষয়াবলি - বাংলাদেশের রাজনৈতিক ব্যবস্থা (নির্বাচন ইতিহাস, রাজনৈতিক দল, সংসদীয় কাঠামো, সুশীল সমাজ ও চাপ সৃষ্টিকারী গোষ্ঠী, পার্বত্য শান্তিচুক্তি, উপজেলা ব্যবস্থা ও সমকালীন রাজনৈতিক ঘটনাপ্রবাহ; পৃষ্ঠা ৫১১-৫১৩)।
(২) সবচেয়ে কঠিন/গুলিয়ে ফেলার জায়গা:
    - জাতীয় সংসদ নির্বাচনের কালানুক্রমিক ইতিহাস (১ম থেকে ১৩শ নির্বাচন): বিভিন্ন নির্বাচনের তারিখ, দলীয় অংশগ্রহণ, সংখ্যাগরিষ্ঠ বিজয়ী দল ও প্রাপ্ত আসনসংখ্যা।
    - পার্বত্য চট্টগ্রাম শান্তিচুক্তি স্বাক্ষরের তারিখ (২ ডিসেম্বর ১৯৯৭) বনাম জনসংহতি সমিতি (PCJSS) প্রতিষ্ঠা (মার্চ ১৯৭৩)।
    - Almond ও Powel-এর চাপ সৃষ্টিকারী গোষ্ঠীর ৪টি ভাগ (প্রাতিষ্ঠানিক, সহায়ক, অ-সহায়ক, বিমূর্ত)।
    - উপজেলা ব্যবস্থার উত্থান-পতন: উন্নীত থানা পরিষদ (১৯৮২) -> উপজেলা নামকরণ (১৯৮৩) -> উপজেলা বাতিল বিল পাস (২৬ জানুয়ারি ১৯৯২) -> পুনরায় চালু (১৯৯৮)।
    - বিকল্প সরকার (বিরোধী দল) বনাম সুশীল সমাজ (রাষ্ট্রের ৫ম স্তম্ভ) বনাম ক্যাবিনেট (অনুচ্ছেদ ৫৫(১))।
    - গণভোটের ইতিহাস (মোট ৪ বার: ১৯৭৭, ১৯৮৫, ১৯৯১ এবং ১২ ফেব্রুয়ারি ২০২৬)।
(৩) বাছাই করা মডিউল:
    - হুক: রাজনৈতিক ব্যবস্থার শীর্ষ ৭টি মেগা ইনসাইট।
    - ভিজ্যুয়াল মডিউল: ১ম থেকে ১৩শ জাতীয় সংসদ নির্বাচনের পূর্ণাঙ্গ তুলনামূলক সারণি, চাপ সৃষ্টিকারী গোষ্ঠীর চতুর্মুখী শ্রেণিবিভাগ কার্ড, উপজেলা বিবর্তন টাইমলাইন।
    - পরীক্ষার ফাঁদ বাক্স (Trap Box): বিকল্প সরকার বনাম সুশীল সমাজ, গণভোটের সঠিক ক্রম ও সাল, আয়নাঘর ও গোপন কারাগার ধারণা।
    - ইন্টারঅ্যাকটিভ কুইজ: ১৩টি পূর্ণাঙ্গ বিসিএস এমসিকিউ-এর লাইভ স্কোরিং, রিয়েল-টাইম অপশন যাচাই ও ড্রয়ার বিশ্লেষণ।
    - অসঙ্গতি ও যাচাই তালিকা: বইয়ের উত্তর কোড ও অপশন বিন্যাসের মুদ্রণবিভ্রাট (প্রশ্ন ১, ২, ৫, ৬, ১৩) নিরসন।
(৪) রঙের মেজাজ: সংসদীয় ও রাষ্ট্রীয় গৌরবোজ্জ্বল ডীপ টিল এবং অটাম গোল্ড প্যালেট (Parliamentary Deep Teal #064E3B, Emerald Accent #059669, Autumn Amber #D97706, Crisp White #FFFFFF, Warm Gray #F8FAFC, Border #CBD5E1).
(৫) হিরো ও মাসকট: জাতীয় সংসদ ও সংবিধান রূপকার মাসকট (🏛️ 🗳️ ⚖️ 📜 🤝).
-->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলাদেশের রাজনৈতিক ব্যবস্থা - বিসিএস জব সল্যুশন ই-বুক</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Kalpurush&family=Noto+Sans+Bengali:wght@400;600;700;800&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #064E3B;
  --primary-light: #059669;
  --secondary: #B45309;
  --accent-gold: #D97706;
  --accent-soft: #ECFDF5;
  --bg-main: #F8FAFC;
  --bg-card: #FFFFFF;
  --text-main: #0F172A;
  --text-muted: #475569;
  --border-color: #CBD5E1;
  --correct-bg: #ECFDF5;
  --correct-color: #047857;
  --wrong-bg: #FEF2F2;
  --wrong-color: #B91C1C;
  --shadow-sm: 0 2px 6px rgba(6, 78, 59, 0.06);
  --shadow-md: 0 6px 18px rgba(6, 78, 59, 0.1);
  --base-font-size: 1rem;
  --radius: 12px;
}

[data-theme="dark"] {
  --primary: #34D399;
  --primary-light: #6EE7B7;
  --secondary: #FBBF24;
  --accent-gold: #FCD34D;
  --accent-soft: #06281E;
  --bg-main: #0B1311;
  --bg-card: #13221E;
  --text-main: #F1F5F9;
  --text-muted: #94A3B8;
  --border-color: #1E3831;
  --correct-bg: #132E20;
  --correct-color: #6EE7B7;
  --wrong-bg: #3E1616;
  --wrong-color: #FCA5A5;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans Bengali', 'Kalpurush', sans-serif;
  font-size: var(--base-font-size);
  line-height: 1.85;
  color: var(--text-main);
  background-color: var(--bg-main);
  transition: background-color 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent-gold));
  width: 0%;
  z-index: 9999;
  transition: width 0.1s ease-out;
}

.top-control-bar {
  position: sticky;
  top: 0;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border-color);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 1000;
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}

.brand-title {
  font-weight: 800;
  color: var(--primary);
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.control-buttons {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-ctrl {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn-ctrl:hover {
  background: var(--primary);
  color: #FFFFFF;
  border-color: var(--primary);
}

.container {
  max-width: 940px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

.hero-box {
  background: linear-gradient(135deg, rgba(6, 78, 59, 0.08), rgba(217, 119, 6, 0.09));
  border: 2px solid var(--primary);
  border-radius: var(--radius);
  padding: 26px 20px;
  margin-bottom: 26px;
  position: relative;
  overflow: hidden;
}

.hero-box::before {
  content: "🏛️";
  font-size: 85px;
  position: absolute;
  right: 15px;
  top: 10px;
  opacity: 0.15;
  pointer-events: none;
}

.badge-tag {
  display: inline-block;
  background: var(--primary);
  color: #FFFFFF;
  padding: 4px 14px;
  font-size: 0.8125rem;
  font-weight: 700;
  border-radius: 20px;
  margin-bottom: 12px;
}

.hero-title {
  font-family: 'Noto Serif Bengali', serif;
  font-size: 1.95rem;
  color: var(--primary);
  margin-bottom: 8px;
  line-height: 1.35;
}

.hero-subtitle {
  font-size: 1.02rem;
  color: var(--text-muted);
  margin-bottom: 18px;
}

.study-steps {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 18px;
  font-size: 0.94rem;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.stat-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}

.stat-num {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--primary);
  display: block;
}

.stat-desc {
  font-size: 0.83rem;
  color: var(--text-muted);
}

.study-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-left: 6px solid var(--primary);
  border-radius: var(--radius);
  padding: 22px 18px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  border-bottom: 1px dashed var(--border-color);
  padding-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}

.section-title {
  font-family: 'Noto Serif Bengali', serif;
  font-size: 1.35rem;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.target-badge {
  font-size: 0.82rem;
  background: rgba(6, 78, 59, 0.08);
  color: var(--primary);
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 700;
}

.bite-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

@media(min-width: 650px) {
  .bite-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.bite-box {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px 16px;
  transition: transform 0.2s, border-color 0.2s;
}

.bite-box:hover {
  transform: translateY(-2px);
  border-color: var(--primary-light);
}

.bite-box h4 {
  color: var(--secondary);
  margin-bottom: 6px;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

.trap-box {
  background: rgba(185, 28, 28, 0.06);
  border: 2px solid var(--wrong-color);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 14px 0;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.trap-icon {
  font-size: 1.5rem;
  line-height: 1;
}

.teaching-note {
  background: var(--accent-soft);
  border-left: 4px solid var(--primary);
  padding: 12px 16px;
  border-radius: 4px 8px 8px 4px;
  margin: 14px 0;
  font-size: 0.95rem;
  color: #1E293B;
}

[data-theme="dark"] .teaching-note {
  color: #F8FAFC;
}

.table-responsive {
  overflow-x: auto;
  margin: 14px 0;
  border: 1px solid var(--border-color);
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.94rem;
}

th {
  background: var(--primary);
  color: #FFFFFF;
  padding: 10px 14px;
  font-weight: 700;
  white-space: nowrap;
}

td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: top;
}

tr:nth-child(even) td {
  background: rgba(6, 78, 59, 0.03);
}

.quiz-dashboard {
  background: var(--bg-card);
  border: 2px solid var(--primary);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.score-display {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--primary);
}

.mcq-card {
  background: var(--bg-card);
  border: 2px solid var(--border-color);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s;
}

.mcq-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}

.mcq-question {
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--text-main);
  flex: 1;
}

.mcq-bcs-tag {
  background: var(--accent-gold);
  color: #FFFFFF;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

@media(min-width: 580px) {
  .options-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

.option-btn {
  background: var(--bg-main);
  border: 1.5px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95rem;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease-in-out;
}

.option-btn:hover:not(:disabled) {
  background: rgba(6, 78, 59, 0.06);
  border-color: var(--primary-light);
}

.option-btn.correct-choice {
  background: var(--correct-bg) !important;
  border-color: var(--correct-color) !important;
  color: var(--correct-color) !important;
  font-weight: 700;
}

.option-btn.wrong-choice {
  background: var(--wrong-bg) !important;
  border-color: var(--wrong-color) !important;
  color: var(--wrong-color) !important;
  font-weight: 700;
}

.explanation-drawer {
  display: none;
  background: var(--bg-main);
  border-left: 4px solid var(--accent-gold);
  border-radius: 0 8px 8px 0;
  padding: 12px 16px;
  margin-top: 12px;
  font-size: 0.93rem;
  line-height: 1.75;
}

.flash-card-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.flash-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.flash-question {
  font-weight: 700;
  color: var(--secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.flash-answer {
  display: none;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-color);
  color: var(--text-main);
  font-size: 0.95rem;
}

.flash-item.open .flash-answer {
  display: block;
}

.discrepancy-card {
  background: #FFF8F6;
  border: 2px solid #FFAB91;
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 30px;
}

[data-theme="dark"] .discrepancy-card {
  background: #241A18;
  border-color: #6E2F26;
}

@media print {
  .top-control-bar, #progress-bar, .btn-ctrl, .quiz-dashboard, #quiz-reset-btn {
    display: none !important;
  }
  body {
    background: #FFFFFF;
    color: #000000;
    font-size: 11pt;
  }
  .study-card, .mcq-card {
    border: 1px solid #777777;
    page-break-inside: avoid;
    box-shadow: none;
  }
  .explanation-drawer {
    display: block !important;
  }
}

/* Universal Mobile Optimization (Samsung A23 & small screens) */
@media (max-width: 600px) {
  .print-btn, button[onclick*="print"], .btn-ctrl:has(span:contains('🖨️')) {
    display: none !important;
  }
  .container {
    padding: 6px 8px 24px 8px !important;
  }
  .hero-box, .hero, .hero-banner {
    padding: 16px 12px !important;
    margin-top: 8px !important;
    margin-bottom: 14px !important;
  }
  .table-responsive, .table-container {
    -webkit-overflow-scrolling: touch;
    overflow-x: auto;
  }
  .table-responsive table th, .table-responsive table td,
  .table-container table th, .table-container table td {
    padding: 7px 6px !important;
  }
}

</style>
</head>

<script>
// পৃষ্ঠা ৫১১ হতে ৫১৩-এর সম্পূর্ণ ১৩টি বিসিএস প্রশ্ন ডাটাবেজ
const bcsPoliticsQuestions = [
  {
    id: 1,

let userPoliticsAnswers = {};

function renderPoliticsQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  bcsPoliticsQuestions.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'mcq-card';
    card.id = `q-${item.id}`;

    const isAnswered = userPoliticsAnswers[item.id] !== undefined;
    const selectedChoice = userPoliticsAnswers[item.id];

    let optButtons = '';
    item.options.forEach((optText, optIdx) => {
      let extraClass = '';
      if (isAnswered) {
        if (optIdx === item.correct) {
          extraClass = ' correct-choice';
        } else if (selectedChoice === optIdx) {
          extraClass = ' wrong-choice';
        }
      }

      optButtons += `
        <button class="option-btn${extraClass}" 
                onclick="answerPoliticsQuestion(${item.id}, ${optIdx})" 
                ${isAnswered ? 'disabled' : ''}>
          <span>${String.fromCharCode(0x0995 + optIdx)}.</span> ${optText}
        </button>
      `;
    });

    card.innerHTML = `
      <div class="mcq-header">
        <div class="mcq-question">${item.q}</div>
        <span class="mcq-bcs-tag">${item.tag}</span>
      </div>
      <div class="options-grid">
        ${optButtons}
      </div>
      <div class="explanation-drawer" style="display: ${isAnswered ? 'block' : 'none'}">
        <strong>💡 সমাধান বিশ্লেষণ:</strong> ${item.exp}
      </div>
    `;

    container.appendChild(card);
  });

  updatePoliticsScore();
}

function answerPoliticsQuestion(qId, choiceIdx) {
  if (userPoliticsAnswers[qId] !== undefined) return;
  userPoliticsAnswers[qId] = choiceIdx;
  renderPoliticsQuiz();
}

function updatePoliticsScore() {
  let score = 0;
  for (let id in userPoliticsAnswers) {
    const q = bcsPoliticsQuestions.find(i => i.id == id);
    if (q && userPoliticsAnswers[id] === q.correct) {
      score++;
    }
  }
  document.getElementById('live-score').textContent = `স্কোর: ${score} / ${bcsPoliticsQuestions.length}`;
}

function resetQuiz() {
  userPoliticsAnswers = {};
  renderPoliticsQuiz();
}

function toggleFlash(card) {
  card.classList.toggle('open');
  const span = card.querySelector('.flash-question span:last-child');
  span.textContent = card.classList.contains('open') ? '➖' : '➕';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const target = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', target);
  try {
    localStorage.setItem('politics_ebook_theme', target);
  } catch(e) {}
}

let fontBase = 16;
function adjustFont(delta) {
  fontBase = Math.max(14, Math.min(22, fontBase + delta));
  document.documentElement.style.setProperty('--base-font-size', fontBase + 'px');
}

window.addEventListener('scroll', () => {
  const scroll = document.documentElement.scrollTop || document.body.scrollTop;
  const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const pct = (scroll / height) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
});

window.addEventListener('DOMContentLoaded', () => {
  try {
    const saved = localStorage.getItem('politics_ebook_theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch(e) {}
  renderPoliticsQuiz();
});
